  # 光标编辑键盘：左上角直接为“返回”（返回上一个键盘），去掉底部中/英按钮
  cursor:
    name: 光标编辑
    author: asogii
    ascii_mode: 0
    horizontal_gap: 2
    vertical_gap: 2
    width: 20
    height: 55
    lock: false
    keys:
      # 第 1 行：返回(回到上一键盘) | 行首 | ▲ | 行尾 | 退格
      - { click: Keyboard_back, width: 20, height: 55, key_back_color: off_key_back_color, hilited_key_back_color: hilited_off_key_back_color }
      - { click: Home, width: 20, height: 55 }
      - { click: Up, width: 20, height: 55, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: End, width: 20, height: 55 }
      - { click: BackSpace, width: 20, height: 55, key_back_color: off_key_back_color, hilited_key_back_color: hilited_off_key_back_color }

      # 第 2 行：全选 | ◀ | 选择(锁定Shift配合方向键选词) | ▶ | ⌦(正删)
      - { click: select_all, width: 20, height: 55, key_back_color: off_key_back_color, hilited_key_back_color: hilited_off_key_back_color }
      - { click: Left, width: 20, height: 55, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
