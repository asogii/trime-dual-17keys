      - { click: Right, width: 20, height: 55, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: Delete, width: 20, height: 55, key_back_color: off_key_back_color, hilited_key_back_color: hilited_off_key_back_color }

      # 第 3 行：剪切 | 上页 | ▼ | 下页 | 复制
      - { click: cut, width: 20, height: 55, key_back_color: off_key_back_color, hilited_key_back_color: hilited_off_key_back_color }
      - { click: Page_Up, width: 20, height: 55 }
      - { click: Down, width: 20, height: 55, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: Page_Down, width: 20, height: 55 }
      - { click: copy, width: 20, height: 55, key_back_color: off_key_back_color, hilited_key_back_color: hilited_off_key_back_color }

