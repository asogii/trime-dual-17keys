# yaml-language-server: $schema=./trime-schema.json
# Trime 乱序17（适配万象官方 /lxsq）
# encoding: utf-8
# 按键发出字母严格对应万象乱序17：q w t y s d f g h j l z x c b n m
# 标签按万象代数分组标注

config_version: "3.0"
name: "乱序17-万象"
author: asogii

style:
  color_scheme: default
  keyboard_height: 260
  keyboard_height_land: 200
  horizontal: true
  keyboard_padding: 2
  keyboard_padding_bottom: 5
  keyboard_padding_land: 0
  keyboard_padding_land_bottom: 0
  reset_ascii_mode: false
  auto_caps: false
  latin_locale: en_US
  locale: zh_CN
  enter_label_mode: 3
  enter_labels:
    go: "前往"
    done: "完成"
    next: "下一个"
    pre: "上一个"
    search: "搜索"
    send: "发送"
    default: "⏎"
  keyboards:
    - default
    - letter
    - number_default
    - number_letter
    - symbols_default
    - symbols_letter
    - cursor
  candidate_use_cursor: true
  candidate_view_height: 32
  candidate_padding: 4
  candidate_spacing: 4
  candidate_text_size: 18
  comment_on_top: false
  comment_height: 16
  comment_text_size: 14
  horizontal_gap: 2
  vertical_gap: 2
  key_height: 55
  key_width: 16
  round_corner: 6
  key_text_size: 17
  key_long_text_size: 14
  symbol_text_size: 12
  key_hint_offset_x: 0
  key_hint_offset_y: -0.5
  preview_height: 48
  preview_offset: -12
  preview_text_size: 36

preedit:
  horizontal_padding: 8
  top_end_radius: 4
  foreground:
    font_size: 16

fallback_colors:
  candidate_text_color: text_color
  keyboard_background: keyboard_back_color
  off_key_symbol_color: off_key_text_color
  hilited_off_key_symbol_color: hilited_off_key_text_color
  on_key_symbol_color: on_key_text_color
  hilited_on_key_symbol_color: hilited_on_key_text_color
  space_back_color: key_back_color
  space_text_color: key_text_color
  hilited_space_back_color: hilited_key_back_color
  enter_back_color: off_key_back_color
  enter_text_color: off_key_text_color
  enter_symbol_color: enter_text_color
  hilited_enter_back_color: hilited_off_key_back_color
  num_key_back_color: key_back_color
  hilited_num_key_back_color: hilited_key_back_color

window:
  insets:
    vertical: 6
    horizontal: 6
  item_padding:
    vertical: 4
    horizontal: 8
  min_width: 240
  corner_radius: 12
  alpha: 0.96
  foreground:
    label_font_size: 18
    text_font_size: 22
    comment_font_size: 16

# 表情/流式键盘：分类栏最左侧增加“返回”，并清空底部固定按键排
liquid_keyboard:
  __include: trime:/liquid_keyboard
  keyboards:
    - exit
    - emoji
    -符号
    - 颜文字
  exit:
    name: "返回"
    type: NO_KEY
    keys: EXIT
  fixed_key_bar:
    keys: []

# 工具栏：使用图标样式（若有图片资源可将 style 改为 xxx.png），隐藏按钮移至最右侧
tool_bar:
  button_spacing: 8
  back_style: "返回"
  buttons:
    - background: { normal: key_back_color, highlight: hilited_key_back_color, type: rectangle, corner_radius: 10, vertical_inset: 6, horizontal_inset: 2 }
      foreground: { style: "⎘", normal: key_text_color, highlight: hilited_key_text_color, font_size: 17, padding: 6 }
      action: clipboard_window
    - background: { normal: key_back_color, highlight: hilited_key_back_color, type: rectangle, corner_radius: 10, vertical_inset: 6, horizontal_inset: 2 }
      foreground: { style: "✥", normal: key_text_color, highlight: hilited_key_text_color, font_size: 17, padding: 6 }
      action: Keyboard_cursor
    - background: { normal: key_back_color, highlight: hilited_key_back_color, type: rectangle, corner_radius: 10, vertical_inset: 6, horizontal_inset: 2 }
      foreground: { style: "☺", normal: key_text_color, highlight: hilited_key_text_color, font_size: 17, padding: 6 }
      action: liquid_keyboard_emoji
    - background: { normal: key_back_color, highlight: hilited_key_back_color, type: rectangle, corner_radius: 10, vertical_inset: 6, horizontal_inset: 2 }
      foreground: { style: "▾", normal: key_text_color, highlight: hilited_key_text_color, font_size: 17, padding: 6 }
      action: Hide

preset_keys:
  __include: trime:/preset_keys
  Hide: { label: "▼", send: BACK }
  BackSpace: { label: "⌫", repeatable: true, functional: true, send: BackSpace }
  Delete: { label: "⌦", repeatable: true, functional: true, send: Delete }
  Return: { label: enter_labels, functional: true, send: Return }
  Shift_L: { label: "⇧", send: Shift_L, shift_lock: swipe_up }
  Edit_Shift: { label: 选择, functional: true, send: Shift_L, shift_lock: click }
  Up: { label: "▲", repeatable: true, functional: true, send: Up }
  Down: { label: "▼", repeatable: true, functional: true, send: Down }
  Left: { label: "◀", repeatable: true, functional: true, send: Left }
  Right: { label: "▶", repeatable: true, functional: true, send: Right }
  Home: { label: 行首, functional: true, send: Home }
  End: { label: 行尾, functional: true, send: End }
  Page_Up: { label: 上页, repeatable: true, functional: true, send: Page_Up }
  Page_Down: { label: 下页, repeatable: true, functional: true, send: Page_Down }
  select_all: { label: 全选, functional: true, send: select_all }
  cut: { label: 剪切, functional: true, send: cut }
  copy: { label: 复制, functional: true, send: copy }
  paste: { label: 粘贴, functional: true, send: paste }
  Keyboard_back: { label: 返回, functional: true, send: Eisu_toggle, select: .last }
  Keyboard_default: { label: 中, functional: true, send: Eisu_toggle, select: default }
  Keyboard_letter: { label: 英, functional: true, send: Eisu_toggle, select: letter }
  Keyboard_number: { label: "123", functional: true, send: Eisu_toggle, select: number_default }
  Keyboard_symbols: { label: 符号, functional: true, send: Eisu_toggle, select: symbols_default }
  Keyboard_number_default: { label: "123", functional: true, send: Eisu_toggle, select: number_default }
  Keyboard_number_letter: { label: "123", functional: true, send: Eisu_toggle, select: number_letter }
  Keyboard_symbols_default: { label: 符号, functional: true, send: Eisu_toggle, select: symbols_default }
  Keyboard_symbols_letter: { label: 符号, functional: true, send: Eisu_toggle, select: symbols_letter }
  Keyboard_cursor: { label: 光标, functional: true, send: Eisu_toggle, select: cursor }
  clipboard_window: { label: 剪贴, send: function, command: clipboard_window, option: "0" }
  liquid_keyboard_emoji: { label: 表情, send: function, command: liquid_keyboard, option: "emoji" }

preset_keyboards:
  default:
    name: 乱序17
    author: asogii
    ascii_mode: 0
    reset_ascii_mode: true
    ascii_keyboard: letter
    horizontal_gap: 2
    vertical_gap: 2
    width: 16
    height: 55
    lock: true
    keys:
      # 上排 6 键 —— 对应万象乱序17字母
      # h = HP / a ia ua
      - { click: h, label: "HP", hint: "a ia ua", label_symbol: "1", swipe_up: "1", width: 17, height: 55 }
      # s = SH / en in
      - { click: s, label: "Sh", hint: "en in", label_symbol: "2", swipe_up: "2", width: 17, height: 55 }
      # z = ZH / ang iao
      - { click: z, label: "Zh", hint: "ang iao", label_symbol: "3", swipe_up: "3", width: 17, height: 55 }
      # b = B / ao iong
      - { click: b, label: "B", hint: "ao iong", label_symbol: "4", swipe_up: "4", width: 16, height: 55 }
      # x = oXv / uai uan
      - { click: x, label: "oXv", hint: "uai uan", label_symbol: "5", swipe_up: "5", width: 17, height: 55 }
      # m = MS / ie uo
      - { click: m, label: "MS", hint: "ie uo", label_symbol: "6", swipe_up: "6", width: 16, height: 55 }

      # 中排 6 键
      # l = L / ai ue
      - { click: l, label: "L", hint: "ai ue", label_symbol: "7", swipe_up: "7", width: 17, height: 55 }
      # d = D / u
      - { click: d, label: "D", hint: "u", label_symbol: "8", swipe_up: "8", width: 17, height: 55 }
      # y = Y / eng ing
      - { click: y, label: "Y", hint: "eng ing", label_symbol: "9", swipe_up: "9", width: 17, height: 55 }
      # w = WZ / e
      - { click: w, label: "WZ", hint: "e", label_symbol: "0", swipe_up: "0", width: 16, height: 55 }
      # j = JK / i
      - { click: j, label: "JK", hint: "i", label_symbol: "！", swipe_up: "！", width: 17, height: 55 }
      # n = NR / an
      - { click: n, label: "NR", hint: "an", label_symbol: "—", swipe_up: "—", width: 16, height: 55 }

      # 下排 5 键 + 退格
      # c = CH / iang ui
      - { click: c, label: "Ch", hint: "iang ui", label_symbol: "（", swipe_up: "（", width: 17, height: 55 }
      # q = Q~ / ian uang
      - { click: q, label: "Q~", hint: "ian uang", label_symbol: "）", swipe_up: "）", width: 17, height: 55 }
      # g = G / ei un
      - { click: g, label: "G", hint: "ei un", label_symbol: "·", swipe_up: "·", width: 17, height: 55 }
      # f = FC / iu ou
      - { click: f, label: "FC", hint: "iu ou", label_symbol: "：", swipe_up: "：", width: 16, height: 55 }
      # t = T / er ong
      - { click: t, label: "T", hint: "er ong", label_symbol: "；", swipe_up: "；", width: 17, height: 55 }
      - {
          click: BackSpace,
          width: 16,
          height: 55,
          key_back_color: off_key_back_color,
          hilited_key_back_color: hilited_off_key_back_color,
        }

      # 底栏（加回逗号，空格缩短）
      - { click: Keyboard_number_default, width: 11, height: 50, key_text_size: 16 }
      - { click: Keyboard_symbols_default, width: 11, height: 50, key_text_size: 16 }
      - { click: comma, label: "，", label_symbol: "、", swipe_up: "、", width: 10, height: 50 }
      - {
          click: space,
          swipe_up: Keyboard_letter,
          width: 28,
          height: 50,
          key_back_color: space_back_color,
          hilited_key_back_color: hilited_space_back_color,
        }
      - {
          click: period,
          label: "。",
          long_click: "？",
          label_symbol: "？",
          swipe_up: "？",
          hint: "…",
          swipe_down: "…",
          width: 12,
          height: 50,
        }
      - {
          click: Keyboard_letter,
          label: "英",
          width: 12,
          height: 50,
          key_text_size: 16,
          key_back_color: off_key_back_color,
          hilited_key_back_color: hilited_off_key_back_color,
        }
      - {
          click: Return,
          composing: Return1,
          long_click: CommitComment,
          label_symbol: " ",
          width: 16,
          height: 50,
          key_text_size: 16,
          key_back_color: enter_back_color,
          hilited_key_back_color: hilited_enter_back_color,
          key_text_color: enter_text_color,
          hilited_key_text_color: enter_text_color,
        }

  # 英文26键
  letter:
    name: 英文26键
    author: asogii
    ascii_mode: 1
    reset_ascii_mode: true
    horizontal_gap: 2
    vertical_gap: 2
    width: 10
    lock: false
    keys:
      # 数字行（单独强调色 num_key_back_color）
      - { click: "1", label_symbol: "°", swipe_up: "°", width: 10, height: 36, key_text_size: 15, symbol_text_size: 9, key_text_offset_y: 4, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "2", label_symbol: "¥", swipe_up: "¥", width: 10, height: 36, key_text_size: 15, symbol_text_size: 9, key_text_offset_y: 4, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "3", label_symbol: "≠", swipe_up: "≠", width: 10, height: 36, key_text_size: 15, symbol_text_size: 9, key_text_offset_y: 4, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "4", label_symbol: "≈", swipe_up: "≈", width: 10, height: 36, key_text_size: 15, symbol_text_size: 9, key_text_offset_y: 4, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "5", label_symbol: "↑", swipe_up: "↑", width: 10, height: 36, key_text_size: 15, symbol_text_size: 9, key_text_offset_y: 4, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "6", label_symbol: "↓", swipe_up: "↓", width: 10, height: 36, key_text_size: 15, symbol_text_size: 9, key_text_offset_y: 4, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "7", label_symbol: "[", swipe_up: "[", width: 10, height: 36, key_text_size: 15, symbol_text_size: 9, key_text_offset_y: 4, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "8", label_symbol: "]", swipe_up: "]", width: 10, height: 36, key_text_size: 15, symbol_text_size: 9, key_text_offset_y: 4, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "9", label_symbol: "{", swipe_up: "{", width: 10, height: 36, key_text_size: 15, symbol_text_size: 9, key_text_offset_y: 4, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "0", label_symbol: "}", swipe_up: "}", width: 10, height: 36, key_text_size: 15, symbol_text_size: 9, key_text_offset_y: 4, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      # 字母行上标（常用符号，含 | ，参考百度风格）
      - { click: "q", label_symbol: "`", swipe_up: "`", width: 10, height: 43 }
      - { click: "w", label_symbol: "^", swipe_up: "^", width: 10, height: 43 }
      - { click: "e", label_symbol: "+", swipe_up: "+", width: 10, height: 43 }
      - { click: "r", label_symbol: "$", swipe_up: "$", width: 10, height: 43 }
      - { click: "t", label_symbol: "<", swipe_up: "<", width: 10, height: 43 }
      - { click: "y", label_symbol: ">", swipe_up: ">", width: 10, height: 43 }
      - { click: "u", label_symbol: "&", swipe_up: "&", width: 10, height: 43 }
      - { click: "i", label_symbol: "|", swipe_up: "|", width: 10, height: 43 }
      - { click: "o", label_symbol: "=", swipe_up: "=", width: 10, height: 43 }
      - { click: "p", label_symbol: "\\", swipe_up: "\\", width: 10, height: 43 }
      - { width: 5, height: 43 }
      - { click: "a", label_symbol: "~", swipe_up: "~", width: 10, height: 43 }
      - { click: "s", label_symbol: "!", swipe_up: "!", width: 10, height: 43 }
      - { click: "d", label_symbol: "@", swipe_up: "@", width: 10, height: 43 }
      - { click: "f", label_symbol: "#", swipe_up: "#", width: 10, height: 43 }
      - { click: "g", label_symbol: "%", swipe_up: "%", width: 10, height: 43 }
      - { click: "h", label_symbol: "'", swipe_up: "'", width: 10, height: 43 }
      - { click: "j", label_symbol: "\"", swipe_up: "\"", width: 10, height: 43 }
      - { click: "k", label_symbol: "*", swipe_up: "*", width: 10, height: 43 }
      - { click: "l", label_symbol: "?", swipe_up: "?", width: 10, height: 43 }
      - { width: 5, height: 43 }
      - { click: Shift_L, width: 15, height: 43 }
      - { click: "z", label_symbol: "(", swipe_up: "(", width: 10, height: 43 }
      - { click: "x", label_symbol: ")", swipe_up: ")", width: 10, height: 43 }
      - { click: "c", label_symbol: "-", swipe_up: "-", width: 10, height: 43 }
      - { click: "v", label_symbol: "_", swipe_up: "_", width: 10, height: 43 }
      - { click: "b", label_symbol: ":", swipe_up: ":", width: 10, height: 43 }
      - { click: "n", label_symbol: ";", swipe_up: ";", width: 10, height: 43 }
      - { click: "m", label_symbol: "/", swipe_up: "/", width: 10, height: 43 }
      - {
          click: BackSpace,
          swipe_left: Escape,
          width: 15,
          height: 43,
          key_back_color: off_key_back_color,
          hilited_key_back_color: hilited_off_key_back_color,
        }
      - { click: Keyboard_number_letter, width: 11, height: 50, key_text_size: 16 }
      - { click: Keyboard_symbols_letter, width: 11, height: 50, key_text_size: 16 }
      - { click: comma, label: ",", width: 10, height: 50 }
      - {
          click: space,
          swipe_up: Keyboard_default,
          width: 28,
          height: 50,
          key_back_color: space_back_color,
          hilited_key_back_color: hilited_space_back_color,
        }
      - {
          click: period,
          label: ".",
          long_click: "?",
          label_symbol: "?",
          swipe_up: "?",
          width: 12,
          height: 50,
        }
      - {
          click: Keyboard_default,
          label: "中",
          width: 12,
          height: 50,
          key_text_size: 16,
          key_back_color: off_key_back_color,
          hilited_key_back_color: hilited_off_key_back_color,
        }
      - {
          click: Return,
          composing: Return1,
          long_click: CommitComment,
          label_symbol: " ",
          width: 16,
          height: 50,
          key_text_size: 16,
          key_back_color: enter_back_color,
          hilited_key_back_color: hilited_enter_back_color,
          key_text_color: enter_text_color,
          hilited_key_text_color: enter_text_color,
        }

  # 数字键盘（共 4 行：退格在右上、无空格、0 在第 4 行中间，中间三列保持左右间距）
  number_default:
    name: 数字
    author: asogii
    ascii_mode: 1
    reset_ascii_mode: true
    horizontal_gap: 2
    vertical_gap: 2
    width: 20
    height: 55
    lock: false
    keys:
      # 第 1 行：+ | 间距 | 1 2 3 | 间距 | 退格(右上)
      - { click: "+", width: 17, height: 55 }
      - { width: 3, height: 55 }
      - { click: "1", width: 20, height: 55, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "2", width: 20, height: 55, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "3", width: 20, height: 55, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { width: 3, height: 55 }
      - { click: BackSpace, width: 17, height: 55, key_back_color: off_key_back_color, hilited_key_back_color: hilited_off_key_back_color }

      # 第 2 行：- | 间距 | 4 5 6 | 间距 | / (上滑 %)
      - { click: "-", width: 17, height: 55 }
      - { width: 3, height: 55 }
      - { click: "4", width: 20, height: 55, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "5", width: 20, height: 55, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "6", width: 20, height: 55, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { width: 3, height: 55 }
      - { click: "/", label_symbol: "%", swipe_up: "%", width: 17, height: 55 }

      # 第 3 行：* | 间距 | 7 8 9 | 间距 | = (上滑 :)
      - { click: "*", width: 17, height: 55 }
      - { width: 3, height: 55 }
      - { click: "7", width: 20, height: 55, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "8", width: 20, height: 55, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: "9", width: 20, height: 55, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { width: 3, height: 55 }
      - { click: "=", label: "=", label_symbol: ":", swipe_up: ":", width: 17, height: 55 }

      # 第 4 行：返回 | 间距 | , 0 . | 间距 | 回车
      - { click: Keyboard_default, label: "返回", width: 17, height: 50, key_text_size: 16, key_back_color: off_key_back_color, hilited_key_back_color: hilited_off_key_back_color }
      - { width: 3, height: 50 }
      - { click: ",", label: ",", label_symbol: ";", swipe_up: ";", width: 20, height: 50 }
      - { click: "0", width: 20, height: 50, key_back_color: num_key_back_color, hilited_key_back_color: hilited_num_key_back_color }
      - { click: ".", label: ".", label_symbol: "#", swipe_up: "#", width: 20, height: 50 }
      - { width: 3, height: 50 }
      - { click: Return, width: 17, height: 50, key_text_size: 16, key_back_color: enter_back_color, hilited_key_back_color: hilited_enter_back_color, key_text_color: enter_text_color, hilited_key_text_color: enter_text_color }

  # 英文数字键盘（共 4 行）
  number_letter:
    name: 英文数字
    author: asogii
    ascii_mode: 1
    reset_ascii_mode: true
    horizontal_gap: 2
    vertical_gap: 2
    width: 20
    height: 55
    lock: false
    keys:
      # 第 1 行
      - { click: "+", width: 17, height: 55 }
      - { width: 3, height: 55 }
