name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install librime and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y librime-dev fonts-noto-cjk

      - name: Download latest trime-cli
        run: |
          mkdir -p tools
          curl -fL \
            https://github.com/nextzhou/trime-cli/releases/latest/download/trime-cli-all.jar \
            -o tools/trime-cli-all.jar

      - name: Validate dual_17keys
        run: java -jar tools/trime-cli-all.jar validate dual_17keys.trime.yaml

      - name: Generate report
        if: always()
        run: |
          mkdir -p build/ci
          java -jar tools/trime-cli-all.jar report dual_17keys.trime.yaml -o build/ci/report.html

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-17keys-report
          path: build/ci/report.html
          if-no-files-found: ignore
